[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "amalgkit"
dynamic = ["version"]
description = "Tools for transcriptome amalgamation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Kenji Fukushima", email = "kfuku52@gmail.com"},
  {name = "Matthias Freund", email = "matthias_freund@outlook.com"},
]
keywords = ["RNA-seq", "transcriptomics", "bioinformatics", "comparative genomics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24.4",
  "pandas>=2.0.3",
  "scipy>=1.10.1",
  "matplotlib>=3.7.5",
  "statsmodels>=0.14.0",
  "scikit-learn>=1.5.0",
  "biopython>=1.87",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
combatseq = ["inmoose"]
test = ["pytest>=9.0.3", "pytest-xdist>=3", "pytest-cov>=7"]
quality = ["build>=1.3", "mypy>=1.19", "pip-audit>=2.9", "ruff>=0.15", "twine>=6"]

[project.scripts]
amalgkit = "amalgkit.cli_entry:main"

[project.urls]
Homepage = "https://github.com/kfuku52/amalgkit"
Documentation = "https://github.com/kfuku52/amalgkit/wiki"
Repository = "https://github.com/kfuku52/amalgkit.git"
Issues = "https://github.com/kfuku52/amalgkit/issues"
Changelog = "https://github.com/kfuku52/amalgkit/releases"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "amalgkit.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["amalgkit*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
amalgkit = [
  "select_rule_sets/base/select_rules.tsv",
  "select_rule_sets/plantae/select_rules.tsv",
  "select_rule_sets/test/select_rules.tsv",
  "select_rule_sets/vertebrate/select_rules.tsv",
  "datasets/yeast/*.fa.gz",
  "datasets/yeast/*.tsv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "benchmark: measures performance-sensitive kernels outside the default test run",
  "integration: exercises multiple production components through their public workflow",
  "slow: performs intentional real rendering, process waiting, or other comparatively slow work",
  "optional_dependency: requires a dependency from an optional project extra",
]
filterwarnings = [
  "error",
  "ignore:Perfect separation or prediction detected:statsmodels.tools.sm_exceptions.PerfectSeparationWarning",
  "ignore:Could not resolve taxid for .*:UserWarning",
  "ignore:Batch seqkit stats scan failed.*:UserWarning",
  "ignore:seqkit stats failed for .* Falling back to Python FASTQ parser.*:UserWarning",
  "ignore:All samples of sample_group .* are marked for exclusion.*:UserWarning",
  'ignore:.*sample\(s\) in .*sample_group\(s\) could not be robustly scored.*:UserWarning',
]

[tool.coverage.run]
branch = true
source = ["amalgkit"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "B023", "RUF012", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_site_packages = true
files = [
  "amalgkit/cross_species_computation.py",
  "amalgkit/command_context.py",
  "amalgkit/getfastq_file_state.py",
  "amalgkit/getfastq_probes.py",
  "amalgkit/linalg_utils.py",
  "amalgkit/logging_utils.py",
  "amalgkit/output_contracts.py",
  "amalgkit/parallel_utils.py",
  "amalgkit/subprocess_utils.py",
  "amalgkit/text_utils.py",
]
