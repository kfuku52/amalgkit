name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            test_suite: full
          - python-version: '3.12'
            test_suite: fast
          - python-version: '3.13'
            test_suite: fast
          - python-version: '3.14'
            test_suite: full

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Run fast tests
        if: matrix.test_suite == 'fast'
        run: >-
          python -m pytest -q -n 2
          -m "not integration and not slow and not optional_dependency"

      - name: Run full tests
        if: matrix.test_suite == 'full'
        run: python -m pytest -q -n 2

  minimum-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install declared minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.24.4" \
            "pandas==2.0.3" \
            "scipy==1.10.1" \
            "matplotlib==3.7.5" \
            "statsmodels==0.14.0" \
            "scikit-learn==1.3.2" \
            "biopython==1.81" \
            "defusedxml==0.7.1" \
            "pytest==8.0.0" \
            "pytest-xdist>=3"
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run tests against dependency floor
        run: python -m pytest -q -n 2

  combatseq:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Combat-seq and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[combatseq,test]"
          python -m pip check

      - name: Run Combat-seq tests
        run: >-
          python -m pytest -q
          tests/test_batch_effect_combatseq.py
          tests/test_finalize_integration.py::test_finalize_python_combatseq_runs_end_to_end

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[quality]"
          python -m pip check

      - name: Run Ruff
        run: ruff check .

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*
