name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# xdist supplies process parallelism; avoid nested BLAS/OpenMP pools.
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 is covered by the complete suite below.
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          uv pip install -e ".[test]"
          uv pip check

      - name: Run fast tests
        run: python -m pytest -q -n 2 -m "not integration and not slow and not optional_dependency"

  full-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-env
        with:
          python-version: '3.14'

      - name: Install package and test dependencies
        run: |
          uv pip install pip -e ".[test,quality]"
          uv pip check

      - name: Lint, formatting, typed boundaries and documentation
        run: python .github/scripts/check_quality.py

      - name: Run full suite with branch coverage
        run: >-
          python -m pytest -q -n 2
          --cov=amalgkit
          --cov-branch
          --cov-report=term
          --cov-report=xml
          --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.14
          path: coverage.xml
          retention-days: 7

      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test installed wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke" --python 3.14
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/check_wheel.py"

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-env
        with:
          python-version: '3.11'
          cache-suffix: minimum

      - name: Install declared minimum dependencies
        run: |
          uv pip install pip -r requirements/minimum.txt \
            -c requirements/minimum-constraints.txt \
            "pip-audit>=2.9" \
            "pytest==9.0.3" \
            "pytest-xdist>=3" \
            "pytest-cov>=7"
          uv pip install --no-deps -e .
          uv pip check

      - name: Run tests against dependency floor
        run: python -m pytest -q -n 2

      - name: Audit dependency floor
        run: python -m pip_audit --local --skip-editable

  combatseq:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-env
        with:
          python-version: '3.11'
          cache-suffix: combatseq

      - name: Install Combat-seq and test dependencies
        run: |
          uv pip install pip -e ".[combatseq,test]" "pip-audit>=2.9"
          uv pip check

      - name: Audit Combat-seq dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Run all optional dependency tests
        run: python -m pytest -q -m optional_dependency
