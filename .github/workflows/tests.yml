name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Run tests
        run: python -m pytest -q -n 2

  minimum-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install declared minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.24.4" \
            "pandas==2.0.3" \
            "scipy==1.10.1" \
            "matplotlib==3.7.5" \
            "statsmodels==0.14.0" \
            "scikit-learn==1.5.0" \
            "biopython==1.87" \
            "defusedxml==0.7.1" \
            "pip-audit>=2.9" \
            "pytest==9.0.3" \
            "pytest-xdist>=3"
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run tests against dependency floor
        run: python -m pytest -q -n 2

      - name: Audit dependency floor
        run: python -m pip_audit --local --skip-editable

  macos-smoke:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Exercise macOS filesystem and CLI paths
        run: >-
          python -m pytest -q
          tests/test_filter_utils.py
          tests/test_cli_utils.py
          tests/test_cli_help.py

  combatseq:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Combat-seq and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[combatseq,test]" "pip-audit>=2.9"
          python -m pip check

      - name: Audit Combat-seq dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Run Combat-seq tests
        run: >-
          python -m pytest -q
          tests/test_batch_effect_combatseq.py
          tests/test_finalize_integration.py::test_finalize_python_combatseq_runs_end_to_end

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[quality]"
          python -m pip check

      - name: Run Ruff
        run: ruff check .

      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --upgrade pip
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python -c "from importlib import resources; assert resources.files('amalgkit').joinpath('select_rule_sets/base/select_rules.tsv').is_file()"
          wheel-smoke/bin/amalgkit --version
          wheel-smoke/bin/amalgkit dataset --list
