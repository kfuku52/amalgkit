name: Nightly End-to-End

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  yeast-private-fastq:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python and real bioinformatics tools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: amalgkit-e2e
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            sra-tools>=3
            seqkit
            kallisto
          cache-environment: true

      - name: Install AMALGKIT
        shell: bash -el {0}
        run: |
          uv pip install --python "$CONDA_PREFIX/bin/python" -e ".[test]"
          uv pip check --python "$CONDA_PREFIX/bin/python"

      - name: Prepare plain/gzip single/paired private FASTQs
        shell: bash -el {0}
        run: |
          amalgkit dataset --name yeast --out_dir e2e-work
          python .github/scripts/nightly_private_fastq.py prepare e2e-work

      - name: Run private inputs through quant, normalization and finalize
        shell: bash -el {0}
        run: |
          mkdir -p e2e-work/metadata e2e-work/logs
          amalgkit --log_file e2e-work/logs/integrate.jsonl integrate \
            --out_dir e2e-work \
            --fastq_dir e2e-work/private-fastq \
            --output_metadata e2e-work/metadata/metadata.tsv \
            --threads 2
          amalgkit --log_file e2e-work/logs/getfastq.jsonl getfastq \
            --out_dir e2e-work \
            --metadata e2e-work/metadata/metadata.tsv \
            --threads 2 \
            --max_bp 10000 \
            --fastp no \
            --rrna_filter no \
            --contam_filter no
          amalgkit --log_file e2e-work/logs/quant.jsonl quant \
            --out_dir e2e-work \
            --metadata e2e-work/metadata/metadata.tsv \
            --threads 2 \
            --build_index yes
          amalgkit --log_file e2e-work/logs/merge.jsonl merge \
            --out_dir e2e-work \
            --metadata e2e-work/metadata/metadata.tsv \
            --threads 2
          amalgkit --log_file e2e-work/logs/cstmm.jsonl cstmm --out_dir e2e-work
          amalgkit --log_file e2e-work/logs/finalize.jsonl finalize \
            --out_dir e2e-work \
            --metadata e2e-work/cstmm/metadata.tsv \
            --threads 2 --batch_effect_alg no
          python .github/scripts/nightly_private_fastq.py verify e2e-work
          amalgkit sanity \
            --out_dir e2e-work \
            --metadata e2e-work/metadata/metadata.tsv \
            --check getfastq,index,quant,merge,finalize \
            --strict yes \
            --strict_level warning

      - name: Run performance benchmarks
        shell: bash -el {0}
        run: |
          python benchmarks/benchmark_core.py --output e2e-work/benchmark-results.json
          python benchmarks/benchmark_table_io.py --rows 1000000 --operation validate --output e2e-work/validation-benchmark.json
          python benchmarks/benchmark_table_io.py --rows 100000 --runs 8 --operation merge --output e2e-work/merge-benchmark.json

      - name: Upload diagnostics and benchmark history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-${{ github.run_id }}
          path: |
            e2e-work/logs
            e2e-work/benchmark-results.json
            e2e-work/*-benchmark.json
            e2e-work/private-input-sha256.json
            e2e-work/sanity
          if-no-files-found: warn
          retention-days: 14
